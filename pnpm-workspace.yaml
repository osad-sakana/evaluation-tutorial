# `playwright-chromium` is needed for `slidev export` (PDF/PNG/PPTX) and has a
# postinstall script that downloads the browser. pnpm v11 errors on unapproved
# build scripts by default (`strictDepBuilds: true`), so allowlist it up-front.
allowBuilds:
  playwright-chromium: true
overrides:
  '@vue/server-renderer@<3.5.42': '^3.5.42'
  baseline-browser-mapping@>=2.0.0 <2.11.0: '^2.11.0'
  browserslist@<=4.28.6: '^4.28.7'
  dompurify@<3.3.2: '^3.3.2'
  dompurify@<3.4.0: '^3.4.0'
  dompurify@<3.4.7: '^3.4.7'
  dompurify@<3.4.9: '^3.4.9'
  dompurify@<=3.3.1: '^3.3.2'
  dompurify@<=3.3.3: '^3.4.0'
  dompurify@<=3.4.10: '^3.4.11'
  dompurify@<=3.4.11: '^3.4.12'
  dompurify@<=3.4.12: '^3.4.13'
  dompurify@<=3.4.15: '^3.4.16'
  dompurify@<=3.4.16: '^3.4.17'
  dompurify@<=3.4.5: '^3.4.6'
  dompurify@<=3.4.6: '^3.4.7'
  dompurify@>=1.0.10 <3.4.0: '^3.4.0'
  dompurify@>=3.0.0 <=3.4.7: '^3.4.8'
  dompurify@>=3.0.1 <3.4.0: '^3.4.0'
  dompurify@>=3.1.3 <=3.3.1: '^3.3.2'
  dompurify@>=3.4.4 <=3.4.16: '^3.4.17'
  image-size@>=0.6.3 <=2.0.2: '^2.0.3'
  image-size@>=1.2.0 <=2.0.2: '^2.0.3'
  js-yaml@>=3.0.0 <3.15.1: '^3.15.1'
  js-yaml@>=3.0.0 <3.15.2: '^3.15.2'
  js-yaml@>=4.0.0 <4.3.1: '^4.3.1'
  js-yaml@>=4.0.0 <4.3.2: '^4.3.2'
  katex@>=0.11.0 <0.18.2: '^0.18.2'
  markdown-it@<14.3.1: '^14.3.1'
